spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/restaurante
spring.datasource.username=root
spring.datasource.password=


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# a serializacao dos campos LAZY (bairro/tipo) depende disso estar ativo
spring.jpa.open-in-view=true

# dados da maquina (usuario do e-mail, pasta de uploads) ficam em application-local.properties
spring.config.import=optional:classpath:application-local.properties

#FOTOS
app.upload-dir=./uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#email (usuario e senha ficam em application-local.properties, que nao e versionado)
spring.mail.host=smtp.mailgun.org
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false

#seguranca (JWT). Segredo e admin inicial ficam em application-local.properties
# sem app.jwt.secret o app gera uma chave aleatoria (os tokens deixam de valer a cada reinicio)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=120
# true = o cadastro aberto (/public/register) aceita role ADMIN, como no exemplo da atividade.
# ATENCAO: com true qualquer pessoa consegue se cadastrar como administrador. Use false em producao.
app.register.permitir-admin=true
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}

#imobiliaria (usado no e-mail "saber mais")
app.imobiliaria.nome=Imobiliária Demo
app.imobiliaria.mensagem=Obrigado pelo seu interesse! Nossa equipe entrará em contato em breve para tirar suas dúvidas e agendar uma visita.
